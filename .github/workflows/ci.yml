name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare scorer with upstream JavaScript
        run: node scripts/verify-scorer.mjs
      - name: Format
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Shell syntax
        run: bash -n scripts/package.sh scripts/tick.sh
      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
      - name: Unit and fake host protocol tests
        run: cargo test --manifest-path backend/Cargo.toml --locked
      - name: Package Linux executable
        run: bash scripts/package.sh x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: codex-quality-guard-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
